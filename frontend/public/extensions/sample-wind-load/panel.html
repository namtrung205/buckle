<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wind load (sample)</title>
  <style>
    /* Mirrors frontend/src/theme.ts so the dock panel matches the app. */
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #343b45;
      color: #e8edf3;
      font: 13px/1.55 "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      padding: 14px;
      box-sizing: border-box;
      gap: 12px;
    }
    h1 { font-size: 0.9rem; margin: 0; font-weight: 600; }
    p { margin: 0; color: #a8b3c1; }
    .field label {
      display: block;
      font-size: 0.75rem;
      color: #a8b3c1;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .field input, .field select {
      width: 100%;
      box-sizing: border-box;
      background: #3d4552;
      color: #e8edf3;
      border: 1px solid #4a5462;
      border-radius: 6px;
      padding: 6px 8px;
      font: inherit;
    }
    .note {
      margin-top: auto;
      border-top: 1px solid #2c333d;
      padding-top: 10px;
      font-size: 0.72rem;
      color: #7c8794;
    }
    code { color: #a8c7ec; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Wind load — sample extension</h1>
  <p>
    Display-only demo panel proving the contribution pathway
    (ribbon button &rarr; command &rarr; registry panel &rarr; dock iframe).
    Panel-to-host communication (selection reads and command submission)
    arrives with the Host API goals of the plugin roadmap.
  </p>
  <div class="field">
    <label for="direction">Direction</label>
    <select id="direction" disabled>
      <option>Windward</option><option>Leeward</option><option>Side</option>
    </select>
  </div>
  <div class="field">
    <label for="pressure">Peak pressure (kPa)</label>
    <input id="pressure" type="number" value="1.20" step="0.05" disabled />
  </div>
  <div class="note">
    Sandbox status: <code id="origin"></code>
  </div>
  <script>
    document.getElementById('origin').textContent =
      location.origin === 'null' ? 'opaque origin — no host access' : location.origin;
  </script>
</body>
</html>
