<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Plugin Workers use data: URLs inside sandboxed opaque-origin iframes.
         The iframe adds a stricter CSP (including connect-src 'none'). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' http://localhost:8000 ws://localhost:* wss://localhost:* https://api.anthropic.com; worker-src 'self' blob: data:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>
    <link ref="stylesheet" href="src/styles.css" > 
  </head>
  <body>
    <div id="root" style="width: 100%; height: 100%;" overflow="hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
